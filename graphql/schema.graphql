  directive @deepAuth(
    path: String
    variables: [String]
  ) on OBJECT
  
  type Version{
    current:String
  }
  "You are the owner or all calendars"
  type Owner @deepAuth(path:"""{ id:"$ownerId" }""", variables: ["$ownerId"]) {
    id:ID!
  }

  "Your calendars"
  type Calendar @deepAuth(path:"""{ owner:{id:"$ownerId"} }""", variables: ["$ownerId"]) {
    id:ID!
    timezone: String @cypher(statement:"match (this)-[:BELONGS_TO]-(tz:TZ) return tz.id limit 1")
    """You the developer"""
    owner: Owner @relation(name:"OWNED" direction:OUT)

    """all events created or accepted by this calendar"""
    events: [Event] @relation(name:"ATTENDING" direction:IN)
    
    """ events within X days from now. default is 7 days"""
    events_withinDays(dayCount:Int=7): [Event] @cypher(statement:"WITH dateTime() AS date1 with date1, date1 + duration({days:$dayCount}) as date2  MATCH (this)-[]-(e:Event)  WITH e, date1, date2, com.vizipi.Procs.toDT(e, true) as starts WHERE starts>=date1 and date2>=starts return distinct e")
    events_between(startAt:String, endAt:String): [Event] @cypher(statement:"MATCH (this)-[]-(e:Event) WITH e, DateTime($startAt) as rStart, DateTime($endAt) as rEnds , com.vizipi.Procs.toDT(e, true) as starts WHERE starts>=rStart and rEnds>=starts return distinct e")

    """all events this calendar was invited to """
    invitedEvents : [Event] @relation(name:"INVITED" direction:IN) 
    """all events accepted by this calendar """
    acceptedEvents : [Event] @relation(name:"ACCEPTED" direction:IN) 

    """all events this calendar declined to accept """
    declinedEvents : [Event] @relation(name:"DECLINED" direction:IN) 
    
    """all events created by this calendar """
    createdEvents : [Event] @relation(name:"BELONGS_TO" direction:IN) 
  }


type Event @deepAuth(path:"""{calendar:{owner:{id:"$ownerId"} }}  """, variables: ["$ownerId"]) {
  id:ID!
  calendar: Calendar @relation(name:"BELONGS_TO" direction:OUT)
  title:String
  body:String
  
  """returns Attending, Declined, Invited, Belongs_to depending on the  action taken by the calendarId specified """
  state (calendarId:String!):String @cypher(statement:"MATCH (this)-[r]-(:Calendar{id:$calendarId}) WHERE not r:ATTENDING and NOT r:INTERACTED and NOT r:NEXTEVENT return type(r) limit 1")
  
    createdAt:String @cypher(statement:"match (this)-[r:BELONGS_TO]-(:Calendar) return  toString(r.created_at)")
  endAt:DateTime
  startAt:DateTime

  """all calendars invited to this event """
  invitedCalendars : [Calendar]  @relation(name:"INVITED" direction:OUT) 
  
  """all calendars accepted this event """
  acceptedCalendars : [Calendar] @relation(name:"ACCEPTED" direction:OUT) 
  
  """all calendars declined this event """
  declinedCalendars : [Calendar] @relation(name:"DECLINED" direction:OUT) 

  attendeeHistory : [EVENT_INTERACTION] 

  linkedCalendars : [EVENT_LINKS]

  }

type EventState{
  value:String
  modifiedAt:String
}

type OWNED @relation(name:"OWNED"){
  from: Calendar
  to: Owner
}
type EVENT_LINKS  @relation(name:"LINKED"){
  from: Event  @neo4j_ignore
  to: Calendar @neo4j_ignore
  action:String
  timeStamp: String  @cypher(statement:"MATCH (this) return toString(this.modified_at)")
  calendarId: String  @cypher(statement:"MATCH (c:Calendar)<-[this]-(:Event) return toString(c.id)")
}
type EVENT_INTERACTION  @relation(name:"INTERACTED"){
  from: Event  @neo4j_ignore
  to: Calendar @neo4j_ignore
  action:String
  timeStamp: String  @cypher(statement:"MATCH (this) return toString(this.modified_at)")
  calendarId: String  @cypher(statement:"MATCH (c:Calendar)<-[this]-(:Event) return toString(c.id)")
}

type TimeSlot{
  from: DateTime
  to: DateTime
}

type Day{
  id: String
}

type Query{
  events_between(startAt:String, endAt:String): [Event] @cypher(statement:"MATCH (:Owner{id:$cypherParams.ownerId})<-[:OWNED]-(:Calendar)-[]-(e:Event) WITH e, DateTime($startAt) as rStart, DateTime($endAt) as rEnds , com.vizipi.Procs.toDT(e, true) as starts WHERE starts>=rStart and rEnds>=starts return distinct e")  
  events_between_for_calendar(startAt:String, endAt:String, calendarId:String): [Event] @cypher(statement:"MATCH (:Owner{id:$cypherParams.ownerId})<-[:OWNED]-(:Calendar{id:$calendarId})-[]-(e:Event) WITH e, DateTime($startAt) as rStart, DateTime($endAt) as rEnds , com.vizipi.Procs.toDT(e, true) as starts WHERE starts>=rStart and rEnds>=starts return distinct e")  

  """
  This will return the first 5 time slots where all the calendarIds supplied are available.
  for example assuming event lengths are 30 minutes and these are some events per calendar
  

| Calendar 1       | Calendar 2     | Calendar 3     |
| :------------- | :----------: | -----------: |
| 2020-01-01 08:00 | 2020-01-01 08:00   | 2020-01-01 07:00    |
| 2020-01-01 10:45 | 2020-01-01 08:45   | 2020-01-01 09:25    | |

should return 
from 2020-01-01 07:30
to   2020-01-01 08:00

from 2020-01-01 09:30
to   2020-01-01 10:00

from 2020-01-01 10:00
to   2020-01-01 10:30

from 2020-01-01 11:15
to   2020-01-01 11:45

  *Note* the time zone is not yes translated :/ and need to add how large of a window is needed
  """
  checkAvailability(calendarIds:[String], fromDate:String!,toDate:String!, durationMinutes: Int  ): [TimeSlot]
  @cypher(statement:"call com.vizipi.Procs.checkAvailability($cypherParams.ownerId, $calendarIds, DateTime($fromDate), DateTime($toDate), $durationMinutes) yield from, to return {from:from,to:to} as node")        
  
}
type Mutation {

  """
  Creates OR updates an existing calander.
  **calendarId**
  If you pass a value you will either create a new calendar with that ID or update an existing one to the specified timezone.
  If you omit the calendarId you will get a new calendar with a randon id
  """
  createOrUpdateCalendar(calendarId:String="", timeZoneOffset:String="Z"): Calendar
  @cypher(statement:"call com.vizipi.Procs.createOrUpdateCalendar($cypherParams.ownerId, $calendarId, $timeZoneOffset) yield node return node")        


  """
  Creates OR updates an existing Event.
  **eventId**
  If you pass a value you will either create a new Event with that ID or update an existing one.
  If you omit the eventId you will get a new Event with a randon id

  **calendarId**
  The calendar this event belongs to.  if the calendar does not exist it will be created ( default timezone )
  """
  createOrUpdateEvent(eventId:String="", calendarId:String!, startAt:String!, endAt:String!,title:String="",body:String=""): Event
  @cypher(statement:"call com.vizipi.Procs.createOrUpdateEvent($cypherParams.ownerId, $calendarId, DateTime($startAt), DateTime($endAt), $title,$body,$eventId) yield node return node")





  """
  invite one or more calendars to this event  ( any non existant calendar will be created and invited )
  """
  inviteToEvent(eventId:String!, calendarIds:[String]): Event
  @cypher(statement:"call com.vizipi.Procs.EventInvite($cypherParams.ownerId, $eventId, $calendarIds) yield node return node")

  acceptInvite(eventId:String!, calendarId:String!): Event
  @cypher(statement:"call com.vizipi.Procs.AcceptInvite($cypherParams.ownerId, $eventId, $calendarId) yield node return node")  

  declineInvite(eventId:String!, calendarId:String!): Event
  @cypher(statement:"call com.vizipi.Procs.DeclineInvite($cypherParams.ownerId, $eventId, $calendarId) yield node return node")    

  unInvite(eventId:String!,  calendarIds:[String]): Event
  @cypher(statement:"call com.vizipi.Procs.EventUnInvite($cypherParams.ownerId, $eventId, $calendarIds) yield node return node")      


"""
Deletes the provided event  will return empty event or an error if you provided the wrong eventid
"""
  deleteEvent(eventId:String!): Event
  @cypher(statement:"call com.vizipi.Procs.DeleteEvent($cypherParams.ownerId, $eventId) yield node return node")      

"""
Deletes the provided calendar and all the events associated with it.  Will return empty calendar or an error if you provided the wrong calendarId
"""
  deleteCalendar(calendarId:String!): Calendar
  @cypher(statement:"call com.vizipi.Procs.DeleteCalendar($cypherParams.ownerId, $calendarId) yield node return node")      
  
}